name: gitleaks

on:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: celesto-memory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The action uploads results.sarif relative to $HOME, and Celesto's
          # workspace is outside it, so the upload throws on every scan. Leaks
          # still fail the job and are listed in its summary.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
